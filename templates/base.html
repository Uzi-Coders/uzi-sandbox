<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Uzi Sandbox{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block css_files %}{% endblock %}
  {#    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">#}
</head>
<body>
<header>
  <div class="header-container">
    <div class="logo">
      {#      <img src="{{ url_for('static', filename='images/uzicoders-logo.png') }}" alt="Uzicoders" class="logo-img">#}
      <a href="{{ url_for('index') }}">
        <span class="site-title">Uzi Sandbox</span>
      </a>
    </div>
    <div class="user-info">
      {% if current_user.is_authenticated %}
        <form action="{{ url_for('auth.logout') }}" method="POST">
          <span class="username">{{ current_user.username }}</span>
          <button type="submit" class="logout-btn">Logout</button>
        </form>
      {% endif %}
    </div>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer>
  <div class="footer-container">
    <p>Created with ❤️ by Raven (Hesam) for UziCoders</p>
    <p class="footer-note">Uzi Sandbox – Sandbox API tools</p>
  </div>
</footer>
</body>
</html>
